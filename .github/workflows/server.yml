name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar Paper 1.21.11
        run: |
          mkdir -p server/plugins
          cd server

          BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/1.21.11 | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['builds'][-1])")

          curl -o paper.jar \
            "https://api.papermc.io/v2/projects/paper/1.21.11/versions/1.21.11/builds/${BUILD}/downloads/paper-1.21.11-${BUILD}.jar"

      - name: Baixar Geyser
        run: |
          curl -L \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" \
            -o server/plugins/Geyser-Spigot.jar

      - name: Baixar Floodgate
        run: |
          curl -L \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" \
            -o server/plugins/floodgate-spigot.jar

      - name: Baixar ViaVersion
        run: |
          curl -L \
            "https://github.com/ViaVersion/ViaVersion/releases/latest/download/ViaVersion.jar" \
            -o server/plugins/ViaVersion.jar

      - name: Aceitar EULA
        run: |
          echo "eula=true" > server/eula.txt

      - name: Iniciar servidor para gerar arquivos
        run: |
          cd server
          timeout 60s java -Xms2G -Xmx4G -jar paper.jar --nogui || true

      - name: Configurar Geyser
        run: |
          sed -i 's/auth-type: online/auth-type: floodgate/' \
            server/plugins/Geyser-Spigot/config.yml || true

      - name: Iniciar Minecraft
        run: |
          cd server
          java -Xms2G -Xmx4G -jar paper.jar --nogui
