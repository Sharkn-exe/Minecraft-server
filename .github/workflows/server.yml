name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Criar pastas
        run: mkdir -p server/plugins

      - name: Baixar Paper 1.21.11
        run: |
          USER_AGENT="Minecraft-GitHub-Server/1.0 (https://github.com/Sharkn-exe/Minecraft-server)"
          MC_VERSION="1.21.11"

          BUILDS=$(curl -fsSL \
            -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds")

          PAPER_URL=$(echo "$BUILDS" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url)')

          if [ "$PAPER_URL" = "null" ] || [ -z "$PAPER_URL" ]; then
            echo "Não foi encontrado um build estável do Paper 1.21.11."
            exit 1
          fi

          echo "Baixando Paper..."
          curl -fsSL \
            -H "User-Agent: $USER_AGENT" \
            "$PAPER_URL" \
            -o server/paper.jar

      - name: Baixar Geyser
        run: |
          curl -fL \
            "https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot" \
            -o server/plugins/Geyser-Spigot.jar

      - name: Baixar Floodgate
        run: |
          curl -fL \
            "https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot" \
            -o server/plugins/floodgate-spigot.jar

      - name: Baixar ViaVersion
        run: |
          curl -fL \
            "https://hangar.papermc.io/api/v1/projects/ViaVersion/versions/5.12.0/PAPER/download" \
            -o server/plugins/ViaVersion.jar

      - name: Aceitar EULA
        run: echo "eula=true" > server/eula.txt

      - name: Configurar servidor
        run: |
          echo "motd=§aMinecraft Survival" > server/server.properties
          echo "gamemode=survival" >> server/server.properties
          echo "difficulty=normal" >> server/server.properties
          echo "hardcore=false" >> server/server.properties
          echo "pvp=true" >> server/server.properties
          echo "online-mode=true" >> server/server.properties
          echo "enable-command-block=false" >> server/server.properties
          echo "spawn-protection=0" >> server/server.properties
          echo "max-players=20" >> server/server.properties
          echo "server-port=25565" >> server/server.properties
          echo "query.port=25565" >> server/server.properties
          echo "enable-query=false" >> server/server.properties

      - name: Primeira inicialização
        run: |
          cd server
          timeout 120s java -Xms2G -Xmx4G -jar paper.jar --nogui || true

      - name: Configurar Floodgate
        run: |
          CONFIG="server/plugins/Geyser-Spigot/config.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "Configuração do Geyser não encontrada."
            exit 1
          fi

          sed -i 's/^  auth-type: .*/  auth-type: floodgate/' "$CONFIG"

          echo "Floodgate configurado."

           - name: Instalar Docker
        run: |
          docker --version

      - name: Iniciar Playit
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          if [ -z "$SECRET_KEY" ]; then
            echo "ERRO: PLAYIT_SECRET_KEY não foi configurado."
            exit 1
          fi

          docker run -d \
            --name playit \
            --network host \
            -e SECRET_KEY="$SECRET_KEY" \
            ghcr.io/playit-cloud/playit-agent:0.17.1

          sleep 10

          echo "=== STATUS DO PLAYIT ==="
          docker logs playit
          
      - name: Iniciar servidor
        run: |
          cd server
          java -Xms2G -Xmx4G -jar paper.jar --nogui
